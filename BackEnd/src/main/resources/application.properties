spring.application.name=cti-insights-backend

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# ---------------------------------------------------------------------------
# Os valores depois dos ":" sao o padrao para rodar local. Para apontar para
# outro servidor, defina as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD
# em vez de editar (e commitar) a senha aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cti_insights}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update: o Hibernate cria e atualiza as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Upload de planilha (POST /api/planilhas)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080
