spring.application.name=cti-insights-backend

# ---------------------------------------------------------------------------
# Banco de dados (Azure Database for PostgreSQL)
# ---------------------------------------------------------------------------
# Nada aqui tem valor real: os ${...} sao buscados no application-local.properties
# (que esta no .gitignore) ou em variaveis de ambiente. Assim senha e chave
# nunca entram no Git. Se faltar algum, a aplicacao NAO sobe - e isso e proposital:
# e melhor quebrar na largada do que subir com um segredo errado.
#
# Rodar com o perfil local:
#   Windows:      .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
#   Linux/macOS:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Na nuvem (Azure) a URL inteira vem pronta na variavel DB_URL:
#   jdbc:postgresql://SERVIDOR.postgres.database.azure.com:5432/ctiinsights?sslmode=require
# No computador, sem DB_URL, ela e montada com DB_HOST, DB_PORT e DB_NAME.
# sslmode=require: o Azure recusa conexao sem criptografia.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ctiinsights}?sslmode=${DB_SSLMODE:require}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update: o Hibernate cria e atualiza as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
# SQL no log so quando pedir (SHOW_SQL=true): na Azure o log gratis e pequeno.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Seguranca (token JWT)
# ---------------------------------------------------------------------------
# JWT_SECRET e a chave que ASSINA o token. Quem a descobre consegue forjar um
# token dizendo ser quem quiser, inclusive ADMIN - por isso ela fica fora do Git.
# Trocar a chave invalida todos os tokens ja emitidos (todos refazem login).
api.security.token.secret=${JWT_SECRET}

# Quanto tempo o token vale. Curto demais incomoda, longo demais aumenta a
# janela de uso de um token roubado. 120 min (2h) e um meio-termo razoavel.
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------------------
# ETL em Python (analytics-python)
# ---------------------------------------------------------------------------
# Depois do upload o Java chama o Python neste endereco, mandando ETL_KEY no
# header X-ETL-Key. O Python so aceita se for igual ao ETL_API_KEY dele.
etl.url=${ETL_URL:http://localhost:8000/etl}
etl.key=${ETL_KEY:}
etl.timeout-seconds=${ETL_TIMEOUT_SECONDS:180}

# ---------------------------------------------------------------------------
# CORS e administrador inicial
# ---------------------------------------------------------------------------
# Endereco do site publicado (Vercel), sem / no fim. Varios: separe por virgula.
cors.origins=${CORS_ORIGINS:}

# Se preenchidos, criam o ADMIN na primeira subida (ver config/AdminInicial).
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Upload da carteira (POST /api/upload)
# ---------------------------------------------------------------------------
# O front envia JSON, nao arquivo. O teto abaixo protege o servidor de um
# corpo gigante (a validacao de 5000 clientes esta no UploadRequest).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
# A Azure informa a porta pela variavel PORT; no computador fica a 8080.
server.port=${PORT:8080}
