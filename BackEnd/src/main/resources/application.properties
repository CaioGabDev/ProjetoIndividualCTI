spring.application.name=cti-insights-backend

# ---------------------------------------------------------------------------
# Banco de dados (Azure Database for PostgreSQL)
# ---------------------------------------------------------------------------
# Nada aqui tem valor real: os ${...} sao buscados no application-local.properties
# (que esta no .gitignore) ou em variaveis de ambiente. Assim senha e chave
# nunca entram no Git. Se faltar algum, a aplicacao NAO sobe - e isso e proposital:
# e melhor quebrar na largada do que subir com um segredo errado.
#
# Rodar com o perfil local:
#   Windows:      .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
#   Linux/macOS:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# sslmode=require: o Azure recusa conexao sem criptografia.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update: o Hibernate cria e atualiza as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Seguranca (token JWT)
# ---------------------------------------------------------------------------
# JWT_SECRET e a chave que ASSINA o token. Quem a descobre consegue forjar um
# token dizendo ser quem quiser, inclusive ADMIN - por isso ela fica fora do Git.
# Trocar a chave invalida todos os tokens ja emitidos (todos refazem login).
api.security.token.secret=${JWT_SECRET}

# Quanto tempo o token vale. Curto demais incomoda, longo demais aumenta a
# janela de uso de um token roubado. 120 min (2h) e um meio-termo razoavel.
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------------------
# Upload da carteira (POST /api/upload)
# ---------------------------------------------------------------------------
# O front envia JSON, nao arquivo. O teto abaixo protege o servidor de um
# corpo gigante (a validacao de 5000 clientes esta no UploadRequest).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080
